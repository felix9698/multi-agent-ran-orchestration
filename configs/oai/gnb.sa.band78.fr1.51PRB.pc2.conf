Active_gNBs = ( "gNB-OAI2");
Asn1_verbosity = "none";

gNBs =
(
 {
    ////////// Identification parameters:
    # Must differ from gNB1 (0xe00) - same gNB_ID on one AMF causes NGAP conflict
    gNB_ID    =  0xe01;
    gNB_name  =  "gNB-OAI2";

    # Must match AMF plmn_support_list (mcc 208 / mnc 95 / tac 0xa000)
    # and oai_db2.sql subscribers (IMSI 20895..., slice sst=222 sd=0x00007B)
    tracking_area_code  =  40960;
    plmn_list = ({ mcc = 208; mnc = 95; mnc_length = 2; snssaiList = ({ sst = 1; }) });

    nr_cellid = 87654321L;

    ////////// Physical parameters:
    min_rxtxtime = 6;

    servingCellConfigCommon = (
    {
      # PCI 1 (gNB1 uses 0) - same-frequency cells must have distinct PCIs
      physCellId                                                    = 1;

      # 51 PRB / 20 MHz / 30kHz SCS - 30.72 MSps (10GbE required on gNB;
      # UE with -E runs at 23.04 MSps - marginal on RPi4, monitor CPU)
      # SSB ARFCN 624672 = 3370.08 MHz (= carrier center; UE -C 3370080000)
      absoluteFrequencySSB                                             = 624672;
      dl_frequencyBand                                                 = 78;
      # PointA ARFCN 624060 = 3360.90 MHz
      dl_absoluteFrequencyPointA                                       = 624060;
        dl_offstToCarrier                                              = 0;
        dl_subcarrierSpacing                                           = 1;
        dl_carrierBandwidth                                            = 51;

        # locationAndBandwidth for 51 PRB (RBstart=0, L=51): 275*(51-1)+0
        initialDLBWPlocationAndBandwidth                               = 13750;
        initialDLBWPsubcarrierSpacing                                   = 1;
        # CORESET0 index 11 (validated with this SSB/PointA pairing)
        initialDLBWPcontrolResourceSetZero                              = 11;
        initialDLBWPsearchSpaceZero                                     = 0;

      ul_frequencyBand                                              = 78;
      ul_offstToCarrier                                             = 0;
      ul_subcarrierSpacing                                          = 1;
      ul_carrierBandwidth                                           = 51;
      pMax                                                          = 20;
        initialULBWPlocationAndBandwidth                            = 13750;
        initialULBWPsubcarrierSpacing                               = 1;

          prach_ConfigurationIndex                                  = 98;
          prach_msg1_FDM                                            = 0;
          prach_msg1_FrequencyStart                                 = 0;
          zeroCorrelationZoneConfig                                 = 13;
          preambleReceivedTargetPower                               = -96;
          preambleTransMax                                          = 6;
        powerRampingStep                                            = 1;
        ssb_perRACH_OccasionAndCB_PreamblesPerSSB_PR                = 4;
        ssb_perRACH_OccasionAndCB_PreamblesPerSSB                   = 14;
        ra_ContentionResolutionTimer                                = 7;
        rsrp_ThresholdSSB                                           = 19;
        prach_RootSequenceIndex_PR                                  = 2;
        # Distinct from gNB1 (1) - avoids inter-cell PRACH preamble collisions
        prach_RootSequenceIndex                                     = 64;
        msg1_SubcarrierSpacing                                      = 1,
        restrictedSetConfig                                         = 0,

        msg3_DeltaPreamble                                          = 1;
        p0_NominalWithGrant                                         =-90;

        pucchGroupHopping                                           = 0;
        # Distinct from gNB1 (40)
        hoppingId                                                   = 41;
        p0_nominal                                                  = -90;

      ssb_PositionsInBurst_Bitmap                                   = 1;
      ssb_periodicityServingCell                                    = 2;
      dmrs_TypeA_Position                                           = 0;
      subcarrierSpacing                                             = 1;

      referenceSubcarrierSpacing                                    = 1;
      dl_UL_TransmissionPeriodicity                                 = 6;
      nrofDownlinkSlots                                             = 7;
      nrofDownlinkSymbols                                           = 6;
      nrofUplinkSlots                                               = 2;
      nrofUplinkSymbols                                             = 4;

      ssPBCH_BlockPower                                             = -25;
  }
  );

    SCTP :
    {
        SCTP_INSTREAMS  = 2;
        SCTP_OUTSTREAMS = 2;
    };

    # AMF runs in docker on PC1; PC2 needs a route:
    #   sudo ip route add 192.168.70.128/26 via 192.168.0.50
    amf_ip_address = ({ ipv4 = "192.168.70.132"; });

    NETWORK_INTERFACES :
    {
        # PC2's own LAN address (NOT PC1's docker bridge)
        GNB_IPV4_ADDRESS_FOR_NG_AMF              = "192.168.50.2/24";
        GNB_IPV4_ADDRESS_FOR_NGU                 = "192.168.50.2/24";
        GNB_PORT_FOR_S1U                         = 2152;
    };
  }
);

MACRLCs = (
{
  num_cc                      = 1;
  tr_s_preference             = "local_L1";
  tr_n_preference             = "local_RRC";
  pusch_TargetSNRx10          = 150;
  pucch_TargetSNRx10          = 200;

  # ---- Outer-loop link adaptation - see docs/mcs0_csi_rootcause.md ----------
  # In SISO the ONLY source of the DL MCS is get_mcs_from_bler()
  # (gNB_scheduler_primitives.c:792, called from gNB_scheduler_dlsch.c:733).
  # CQI/CSI-RS can never RAISE the DL MCS - a CSI report only writes the
  # per-UE ceiling sched_ctrl->dl_max_mcs (gNB_scheduler_uci.c:519/655).
  # Enabling do_CSIRS therefore does NOT fix an MCS-0 lock; it was measured
  # to be irrelevant here.
  #
  # The loop raises MCS by +1 per 10 frames only while the filtered BLER is
  # BELOW *_lower, and lowers it above *_upper; inside the band it freezes.
  # A PUCCH DTX is scored as a NACK (gNB_scheduler_uci.c:912,
  # success = harq_value==0 && harq_confidence==0), so every HARQ feedback the
  # RPi5 UE fails to transmit inflates the measured BLER. At a 51-PRB grant the
  # UE runs late and that DTX floor is 10-15%, which sits inside/above the
  # stock [0.10,0.15] band -> MCS pinned at dl_min_mcs = 0 forever
  # (measured: 51 PRB uncapped -> MCS 0-2, 1.9-2.3 Mbps DL).
  # Lifting the band above the DTX floor lets the loop climb again.
  dl_bler_target_upper        = 0.25;
  dl_bler_target_lower        = 0.15;
  dl_min_mcs                  = 0;
  # Hard safety ceiling. On a 24-PRB cell this UE (RPi5 + B210) dies on a USRP
  # short-read AssertFatal at MCS 13. Measured DL goodput at 24 PRB, att_tx 18:
  # MCS 8 -> 2.57 Mbps (BLER 0.48), MCS 11 -> 4.92 Mbps (BLER 0.13), MCS 13 -> dead.
  dl_max_mcs                  = 11;
  # Same freeze applies to the UL loop (measured UL BLER 0.30-0.55 -> MCS 0
  # while PUSCH SNR was 31 dB). With a bounded DL grant the UL reaches MCS 20+.
  ul_bler_target_upper        = 0.25;
  ul_bler_target_lower        = 0.15;
  ul_min_mcs                  = 0;
  ul_max_mcs                  = 24;
  #
  # REQUIRED COMPANION SETTING (runtime, not expressible in this file):
  #   on the 51/106 PRB profiles the DL grant must be capped at <= 25 PRB, else
  #   the UE cannot decode in time and the DTX floor returns. After gNB start:
  #     printf 'ci prbcap 25\n' | nc -q1 127.0.0.1 9091
}
);

L1s = (
{
  num_cc = 1;
  tr_n_preference       = "local_mac";
  prach_dtx_threshold   = 120;
  pucch0_dtx_threshold  = 100;
  ofdm_offset_divisor   = 8;
}
);

RUs = (
{
  local_rf       = "yes"
  # NOTE: after the 10GbE SFP+ swap this address changes
  # (X310 HG image: 10G port = 192.168.20.2 by default).
  # Run scripts/setup_10g.sh to detect and update automatically.
  # PC2's X310 (XG image) lives on the 192.168.30.x SFP subnet - PC1's is on
  # 192.168.40.x. Using PC1's address here makes gNB2 die with
  # "No USRP Device Found" (common_lib.c:148). Verify with uhd_find_devices.
  sdr_addrs      = "addr=192.168.30.2";
  nb_tx          = 1
  nb_rx          = 1
  # 18 dB baseline attenuation = 0 dB power-offset reference for the runtime
  # gain control (ci rfatt). 12 dB was too HOT at the current 70 cm UE
  # spacing: the UE derives its UL power from DL pathloss, so a strong DL
  # made it under-transmit and every PUCCH came back DTX (measured: 12 dB ->
  # DTX +124/30 s and DL BLER 0.98; 18 dB -> DTX 0 and BLER 0.018, both
  # directions reproducible).
  
  att_tx         = 18;
  att_rx         = 12;
  bands          = [78];
  max_pdschReferenceSignalPower = -27;
  max_rxgain                    = 114;
  eNB_instances  = [0];
  clock_src = "internal";
}
);

security = {
  ciphering_algorithms = ( "nea0" );
  integrity_algorithms = ( "nia2", "nia0" );
  drb_ciphering = "yes";
  drb_integrity = "no";
};

log_config :
{
  global_log_level                      ="info";
  hw_log_level                          ="info";
  phy_log_level                         ="info";
  mac_log_level                         ="info";
  rlc_log_level                         ="info";
  pdcp_log_level                        ="info";
  rrc_log_level                         ="info";
  ngap_log_level                        ="debug";
  f1ap_log_level                        ="debug";
};
