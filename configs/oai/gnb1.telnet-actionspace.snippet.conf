// Merge this top-level stanza into the gNB1 runtime configuration.
// The nr-softmodem process must also be started with --telnetsrv so that the
// server library is loaded; shrmod loads libtelnetsrv_ci.so and registers "ci".
telnetsrv = {
  listenaddr = "0.0.0.0";
  listenport = 9091;
  shrmod = ("ci");
};
