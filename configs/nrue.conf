# OAI NR-UE reference configuration (Band 78, SA mode)
#
# NOTE: The GUI launch path (SystemController) generates a per-UE conf like
# this on each RPi at start time; this file documents the working format.
# Manual run example (24 PRB, 1GbE). Frequencies follow
# SystemController.PRB_CONFIG (the source of truth): gNB1 = 3349.92 MHz,
# gNB2 = 3370.08 MHz (separate carriers; see the 2026-07-09 note there).
#
#   sudo ./nr-uesoftmodem -O nrue.conf -r 24 --numerology 1 --band 78 \
#        -C 3349920000 --ssb 24        # 24 PRB: --ssb 24, NO -E
#   (51 PRB: -C 3349920000 --ssb 186 -E ; 106 PRB: -C 3349920000 --ssb 516 -E;
#    UE2 on gNB2 uses -C 3370080000 at 24/51 PRB; 106 PRB is single-cell)
#
# The PDU session MUST be declared in pdu_sessions here - cmdline --uicc0.*
# args set the USIM identity but leave the PDU session list empty (no tun).
# nssai_sst must be <= 4 (OAI conf validation); the subscribers are
# re-provisioned to SST=1 dnn "oai" by scripts/provision_subscribers.sh.
#
# Template only: replace the placeholders with operator-provisioned values
# matching the CN database before manual use. SystemController instead requires
# AIC_UICC_KEY and AIC_UICC_OPC (nonzero 32-hex values) at UE launch time.
#   UE1: imsi 208950000000031   UE2: imsi 208950000000032

uicc0 = {
  imsi = "208950000000031";
  key = "REPLACE_WITH_AIC_UICC_KEY";
  opc = "REPLACE_WITH_AIC_UICC_OPC";
  pdu_sessions = ({ dnn = "oai"; nssai_sst = 1; });
}
